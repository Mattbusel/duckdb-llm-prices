[workspace]
members = ["crates/core", "crates/native", "crates/wasm"]
default-members = ["crates/native"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Mattbusel/duckdb-llm-prices"
authors = ["Matthew Busel <mattbusel@tensorust.com>"]

[workspace.dependencies]
duckdb-neo = { version = "=0.20000.2", features = ["build-extension"] }
# The price table: dated, source-cited rows compiled into the binary. No network, no key.
prices = { package = "llm-prices", version = "1.3", default-features = false }
llm_prices_duckdb = { path = "crates/core" }

[profile.release]
lto = true
strip = true
codegen-units = 1
